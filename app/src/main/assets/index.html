<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<title>ATAK</title>
<style>
/* 레이아웃: ATAK처럼 지도가 주인공, 오른쪽에 자기 정보(SELF) 계기판 한 줄, 지도 위에는 방위·축척만 */
:root{
  color-scheme:dark;
  --bg:#000;
  --panel:#0c0f12;
  --line:#2a3138;
  --fg:#f2f5f7;
  --dim:#8d99a3;
  --self:#19d3ff;        /* ATAK 자기 위치 화살표 색 */
  --mark:#ffe600;        /* 지도 점선과 같은 노랑 */
  --ok:#5dff7a;
  --warn:#ffa41c;
  --red:#ff4a3d;
  --blue:#4aa3ff;
  --mono:ui-monospace,"Roboto Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;
  --font:system-ui,-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}
#app{display:flex;height:100%;width:100%;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
#stage{position:relative;flex:1;min-width:0;min-height:0;overflow:hidden;background:#000}
#world{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;will-change:transform}
#world img{display:block;width:1920px;height:1080px;pointer-events:none}
#grid{position:absolute;left:0;top:0;width:1920px;height:1080px;pointer-events:none}
#grid line{stroke:rgba(255,255,255,.8);stroke-width:2}
#grid text{font-family:var(--font);font-weight:900;fill:#fff;paint-order:stroke;stroke:rgba(0,0,0,.8)}
#grid text.hd{font-size:50px;stroke-width:8px}
#grid text.cell{font-size:16px;stroke-width:4px;fill:rgba(255,255,255,.7)}
#gridS{color:var(--fg)!important}
#acc{position:absolute;left:0;top:0;border-radius:50%;background:rgba(25,211,255,.13);
  border:2px solid rgba(25,211,255,.6);pointer-events:none}
#me{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
#world.glide,#acc.glide,#me.glide{transition:transform .9s linear,width .9s,height .9s}
#me svg{position:absolute;left:-22px;top:-22px;width:44px;height:44px;overflow:visible;
  filter:drop-shadow(0 0 3px #000) drop-shadow(0 0 6px rgba(0,0,0,.8))}
#me .shape{fill:var(--self);stroke:#fff;stroke-width:2.5;stroke-linejoin:round}
#me.stale .shape{fill:var(--warn)}
#chev{transform-origin:22px 22px;transition:transform .25s linear}

.ov{position:absolute;z-index:4;background:rgba(0,0,0,.62);border:1px solid rgba(255,255,255,.28);
  border-radius:3px;font-family:var(--mono);font-weight:700;color:var(--fg);pointer-events:none}
#north{left:8px;top:8px;width:38px;height:46px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;font-size:13px;line-height:1}
#north i{width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
  border-bottom:16px solid var(--red);margin-bottom:3px}
#scale{right:8px;bottom:8px;padding:4px 8px 5px;font-size:12px}
#bar{height:6px;border:2px solid #fff;border-top:0;margin-top:2px}
#testTag{right:8px;top:8px;padding:5px 9px;font-family:var(--font);font-size:13px;color:#fff;background:rgba(200,30,20,.88);border-color:#fff;z-index:5}
#toast{position:absolute;left:50%;top:8px;transform:translateX(-50%);max-width:80%;z-index:7;
  background:rgba(0,0,0,.85);border:1px solid var(--mark);padding:7px 14px;border-radius:3px;
  font-size:14px;font-weight:700;text-align:center}

#gate{position:absolute;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:8px;padding:16px;text-align:center;font-family:var(--mono);
  background-color:#05080a;background-image:repeating-linear-gradient(0deg,transparent 0 39px,#10202a 39px 40px),
  repeating-linear-gradient(90deg,transparent 0 39px,#10202a 39px 40px)}
#gate b{font-family:var(--font);font-size:clamp(18px,6vh,26px);color:var(--fg)}
#gate span{font-size:clamp(20px,8vh,34px);font-weight:700;color:var(--self);font-variant-numeric:tabular-nums}
#gate small{font-size:12px;color:var(--dim);font-family:var(--font)}
#hud{width:clamp(128px,17vw,158px);background:var(--panel);border-left:1px solid var(--line);
  display:flex;flex-direction:column;gap:4px;padding:5px 7px;font-family:var(--mono);min-height:0}
.lbl{font-size:10px;letter-spacing:.1em;color:var(--dim);font-weight:700;font-family:var(--mono)}
#top{display:flex;justify-content:space-between;align-items:baseline}
#clock{font-size:clamp(18px,6.4vh,26px);font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;text-align:center}
#zone{font-family:var(--font);font-size:clamp(44px,19vh,78px);line-height:.95;font-weight:900;
  color:var(--mark);text-align:center}
#zone.out{font-size:clamp(20px,7.5vh,30px);color:var(--warn);padding:.55em 0}
#status{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 0;display:grid;gap:2px}
#status div{display:flex;justify-content:space-between;align-items:baseline}
#status b{font-family:var(--font);font-size:clamp(14px,4.8vh,19px);font-weight:800;color:var(--ok);
  font-variant-numeric:tabular-nums;white-space:nowrap}
#status b.bad{color:var(--warn)}
#status b.off{color:var(--red)}
#btns{flex:1;min-height:0;display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:6px;padding-top:2px}
button{font-family:var(--font);font-size:clamp(13px,4.4vh,19px);font-weight:800;color:var(--fg);background:#1a2026;
  border:1px solid #46525d;border-radius:4px;min-height:44px;padding:0;white-space:nowrap}
button:active{background:#2c353e}
button:focus-visible{outline:2px solid var(--self);outline-offset:1px}
#bSet{grid-column:1/3}
#coord{font-family:var(--mono);font-size:clamp(12px,3.9vh,15px);font-weight:700;color:var(--self);
  text-align:center;line-height:1.25;white-space:nowrap;font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line);padding-bottom:4px}
#set{background:rgba(0,0,0,.93);gap:clamp(8px,3vh,16px)}
#set h2{margin:0;font-family:var(--mono);font-size:18px;letter-spacing:.1em;color:var(--self)}
#setGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;width:min(100%,560px)}
#setGrid button{min-height:clamp(46px,15vh,64px);font-size:clamp(14px,4.6vh,18px)}
#bClose{background:var(--self);color:#001318;border-color:var(--self)}
button.on{background:var(--self);color:#001318;border-color:var(--self)}

.cover{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:14px;padding:20px;text-align:center}
#start{background:#000}
#start h1{margin:0;font-family:var(--mono);font-size:24px;font-weight:700;color:var(--self);letter-spacing:.06em}
#start p{margin:0;max-width:30em;font-size:clamp(14px,4.6vh,17px);line-height:1.45}
#start b{color:var(--mark)}
#start p.fine{font-size:12px;color:var(--dim)}
#start{gap:clamp(6px,2.4vh,14px)}
#go{flex:none;font-size:22px;min-height:64px;padding:0 44px;background:var(--self);color:#001318;border:0}
#lock{background:transparent;justify-content:flex-end;padding-bottom:10px}
#lock div{background:rgba(0,0,0,.8);border:1px solid var(--line);border-radius:3px;
  padding:6px 12px;font-size:13px;font-weight:700;color:var(--dim)}
#lock.hold div{color:#001318;background:var(--self)}
@media (orientation:portrait){
  #app{flex-direction:column}
  #hud{width:auto;height:clamp(210px,36vh,330px);border-left:0;border-top:1px solid var(--line);
    display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);column-gap:10px;padding:8px 10px;
    grid-template-rows:auto 1fr auto auto auto;grid-template-areas:"zlbl btns" "zone btns" "clock btns" "status btns" "coord btns"}
  #zlbl{grid-area:zlbl} #zone{grid-area:zone;align-self:center} #clock{grid-area:clock} #status{grid-area:status} #coord{grid-area:coord;font-size:clamp(12px,2vh,15px)}
  #setGrid{grid-template-columns:1fr} #setGrid button{min-height:clamp(46px,7vh,64px);font-size:clamp(14px,2.3vh,18px)}
  #zone{font-size:clamp(44px,9vh,78px)} #zone.out{font-size:clamp(20px,3.6vh,30px)}
  #clock{font-size:clamp(18px,3vh,26px)} #status b{font-size:clamp(14px,2.3vh,19px)}
  #btns{grid-area:btns;padding-top:0} button{font-size:clamp(15px,2.5vh,20px)}
}
</style>
</head>

/* ---------- 지도 기준값 ---------- */
var W=1920,H=1080;
var MPP=0.3291;                 // 지도 1픽셀 = 0.3291m (네이버 30m 축척 막대로 측정)
var ANCHOR={x:375,y:548,lat:36.1948535,lon:127.4760206};  // 코만도파크 본관 건물
var MLAT=110963, MLON=89937;    // 이 위도에서 1도당 미터
var SPAWNS=[[475,680],[755,180],[1352,730],[1700,605]];
var FIELD=[[420,650],[418,390],[462,290],[520,232],[650,170],[805,148],[930,250],[985,290],[1003,380],
  [1110,460],[1275,502],[1335,472],[1510,442],[1680,470],[1750,548],[1772,725],[1740,798],[1415,810],
  [1345,752],[1195,768],[1065,730],[940,758],[780,764],[595,688],[470,722]];
var DIV=[[672,170,622,695],[930,255,882,750],[1207,485,1193,768],[1433,458,1397,795]]; // A|B, B|C, C|D, D|E

var $=function(id){return document.getElementById(id)};
var stage=$("stage"),world=$("world"),me=$("me"),acc=$("acc"),chev=$("chev"),round=$("round");
var off={x:0,y:0},pos=null,follow=false,calMode=false,lastFix=0,toastT=0;
var gpsHdg=null,gpsHdgT=0,compass=null;
var CENTER={x:1095,y:480},NEAR_M=1e9,far=true,farM=0;   // 필드 중심에서 1km 안에서만 지도 표시
var zl=0,ZL=[1,1.6,2.6,4];                              // 확대 단계 (0 = 필드 전체)
try{var s=JSON.parse(localStorage.getItem("cp_off"));if(s&&isFinite(s.x)&&isFinite(s.y))off=s}catch(e){}

function toPx(lat,lon){
  return {x:ANCHOR.x+(lon-ANCHOR.lon)*MLON/MPP+off.x, y:ANCHOR.y-(lat-ANCHOR.lat)*MLAT/MPP+off.y};
}
/* 보정값까지 반영한 좌표: 지도 위 점이 가리키는 실제 위경도 */
function toLL(x,y){
  return {lat:ANCHOR.lat-(y-ANCHOR.y)*MPP/MLAT, lon:ANCHOR.lon+(x-ANCHOR.x)*MPP/MLON};
}
/* 격자: 작전용 그리드 지도와 같은 칸 (가로 A~K, 세로 1~8). 값은 그 지도를 이 지도에 겹쳐서 잰 것 */
var GX0=410.2,GDX=124.22,GY0=136.9,GDY=84.3,GCOLS="ABCDEFGHIJK",GROWS=8;
var VB={x:286.7,y:53.5,w:1489.2,h:757.8};     // 그리드 지도가 보여 주는 범위
function gridOf(p){
  var c=Math.floor((p.x-GX0)/GDX),r=Math.floor((p.y-GY0)/GDY);
  if(c<0||c>=GCOLS.length||r<0||r>=GROWS)return "–";
  return GCOLS[c]+(r+1);
}
function inField(p){
  var c=false;
  for(var i=0,j=FIELD.length-1;i<FIELD.length;j=i++){
    var a=FIELD[i],b=FIELD[j];
    if((a[1]>p.y)!==(b[1]>p.y)&&p.x<(b[0]-a[0])*(p.y-a[1])/(b[1]-a[1])+a[0])c=!c;
  }
  return c;
}
function zoneOf(p){
  if(!inField(p))return null;
  var n=0;
  for(var i=0;i<DIV.length;i++){
    var d=DIV[i],x=d[0]+(d[2]-d[0])*(p.y-d[1])/(d[3]-d[1]);
    if(p.x>x)n=i+1;
  }
  return "ABCDE"[n];
}
function toast(msg,ms){
  var t=$("toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);
  if(ms)toastT=setTimeout(function(){t.hidden=true},ms);
}
function pad2(n){return (n<10?"0":"")+n}

/* ---------- 화면 배치 ---------- */
var view={k:1,tx:0,ty:0};
function layout(glide){
  var sw=stage.clientWidth,sh=stage.clientHeight,fit=Math.min(sw/VB.w,sh/VB.h),k,tx,ty;
  if(follow&&pos){
    k=fit*ZL[zl];
    tx=Math.min(0,Math.max(sw-W*k,sw/2-pos.x*k));
    ty=Math.min(0,Math.max(sh-H*k,sh/2-pos.y*k));
  }else{k=fit;tx=(sw-VB.w*k)/2-VB.x*k;ty=(sh-VB.h*k)/2-VB.y*k}
  view={k:k,tx:tx,ty:ty};
  world.classList.toggle("glide",!!glide);
  me.classList.toggle("glide",!!glide);acc.classList.toggle("glide",!!glide);
  world.style.transform="translate("+tx+"px,"+ty+"px) scale("+k+")";
  var m=10,ms=[100,50,20,10];for(var i=0;i<ms.length;i++){if(ms[i]/MPP*k<=110){m=ms[i];break}}
  $("barTxt").textContent=m+"m";$("bar").style.width=(m/MPP*k)+"px";
  if(pos){
    me.style.transform="translate("+pos.x+"px,"+pos.y+"px) scale("+(1/k)+")";
    var r=Math.max(pos.acc/MPP,4);
    acc.style.width=acc.style.height=(2*r)+"px";
    acc.style.transform="translate("+(pos.x-r)+"px,"+(pos.y-r)+"px)";
  }
}
window.addEventListener("resize",function(){layout(false)});

/* ---------- 방위: 움직일 땐 GPS 진행 방향, 서 있을 땐 폰 나침반 ---------- */
function heading(){
  if(gpsHdg!=null&&Date.now()-gpsHdgT<3000)return {d:gpsHdg,src:"GPS"};
  if(compass!=null)return {d:compass,src:"나침반"};
  return null;
}
function drawHeading(){
  var h=heading();
  chev.toggleAttribute("hidden",!h);round.toggleAttribute("hidden",!!h);
  if(h)chev.style.transform="rotate("+h.d+"deg)";
}
function onOrient(e){
  if(window.Native)return;
  var a=null;
  if(typeof e.webkitCompassHeading==="number")a=e.webkitCompassHeading;
  else if(e.absolute&&e.alpha!=null)a=360-e.alpha;
  if(a==null)return;
  var sa=(screen.orientation&&screen.orientation.angle)||0;
  compass=((a+sa)%360+360)%360;drawHeading();
}
window.addEventListener("deviceorientationabsolute",onOrient);
window.addEventListener("deviceorientation",onOrient);

/* ---------- 위치 받기 ---------- */
function refreshText(){
  var z=zoneOf(pos),ze=$("zone");
  ze.textContent=far?"–":(z||"필드 밖");ze.classList.toggle("out",!z&&!far);
  $("gridS").textContent=far?"–":gridOf(pos);
  var g=toLL(pos.x,pos.y);
  $("lat").textContent="N "+g.lat.toFixed(5);$("lon").textContent="E "+g.lon.toFixed(5);
}
/* 테스트 모드: 켠 순간의 내 자리를 필드 한가운데(C구역)로 가정하고, 거기서 움직인 만큼 지도에서도 움직인다 */
var testMode=false,testBase=null,lastG=null,TEST_AT={x:1050,y:500};
function onFix(g){
  lastG=g;
  var c=g.coords,p=toPx(c.latitude,c.longitude),first=!pos;
  if(testMode){
    if(!testBase)testBase={x:p.x,y:p.y};
    p={x:TEST_AT.x+(p.x-testBase.x),y:TEST_AT.y+(p.y-testBase.y)};
  }
  pos={x:p.x,y:p.y,acc:c.accuracy||0};
  var gx=(pos.x-CENTER.x)*MPP,gy=(pos.y-CENTER.y)*MPP;
  farM=Math.sqrt(gx*gx+gy*gy);far=farM>NEAR_M;
  $("gate").hidden=!far;
  if(far){$("gTitle").textContent="코만도파크 근처가 아니에요";
    $("gDist").textContent="필드까지 "+(farM>=10000?Math.round(farM/1000):(farM/1000).toFixed(1))+"km"}
  lastFix=Date.now();
  if(first&&(p.x<0||p.x>W||p.y<0||p.y>H))setTimeout(function(){toast("설정 → 위치 보정을 누르고, 지금 서 있는 곳을 지도에서 찍어 주세요")},300);
  me.hidden=acc.hidden=false;me.classList.remove("stale");
  if(c.heading!=null&&!isNaN(c.heading)&&c.speed>0.8){gpsHdg=c.heading;gpsHdgT=lastFix}
  layout(!first);refreshText();drawHeading();
  drawGps();
  if(first&&!calMode)$("toast").hidden=true;
}
function onErr(e){
  var m=e.code===1?"위치 권한이 꺼져 있어요. 주소창 자물쇠 → 권한 → 위치를 허용해 주세요."
       :e.code===2?"GPS 신호를 못 잡고 있어요. 하늘이 보이는 곳으로 나가 보세요."
       :"위치 응답이 늦어요. 다시 시도하는 중…";
  if(e.code===1||!pos)toast(m,e.code===1?0:4000);
  if(e.code===1)gpsDenied=true;drawGps();
}
/* GPS 상태: 정상이면 오차(m), 끊기면 몇 초 전 값인지 */
var gpsDenied=false;
function drawGps(){
  var e=$("gpsS"),old=false;
  if(gpsDenied&&!pos){e.textContent="권한 없음";e.className="off";return false}
  if(!pos){e.textContent="대기";e.className="bad";return false}
  var age=Math.round((Date.now()-lastFix)/1000);old=age>=5;
  if(old){e.textContent=age>99?"끊김":age+"초 전";e.className=age>=30?"off":"bad"}
  else{e.textContent="±"+Math.round(pos.acc)+"m";e.className=pos.acc>25?"bad":""}
  return old;
}
/* 데이터(인터넷) 연결 여부 */
function setData(on){var e=$("dataS");e.textContent=on?"연결":"없음";e.className=on?"":"off"}
window.onNativeData=setData;
if(!window.Native){
  setData(navigator.onLine);
  window.addEventListener("online",function(){setData(true)});
  window.addEventListener("offline",function(){setData(false)});
}
function startGps(){
  if(!window.isSecureContext){toast("https:// 로 시작하는 주소에서 열어야 위치를 받을 수 있어요.");return}
  if(!navigator.geolocation){toast("이 브라우저는 위치 기능을 지원하지 않아요.");return}
  toast("GPS 잡는 중…");
  navigator.geolocation.watchPosition(onFix,onErr,{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
setInterval(function(){
  var d=new Date();
  $("clock").textContent=pad2(d.getHours())+":"+pad2(d.getMinutes())+":"+pad2(d.getSeconds());
  var old=drawGps();
  if(!pos)return;
  me.classList.toggle("stale",old);
  drawHeading();
  sendWatch(old);
},1000);

/* ---------- 화면 켜둠 / 전체화면 ---------- */
function keepAwake(){
  if(!("wakeLock" in navigator))return;
  navigator.wakeLock.request("screen").catch(function(){});
}
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible")keepAwake()});
$("go").addEventListener("click",function(){
  if(window.Native){try{window.Native.askLocation()}catch(e){}return}   // 설치형 앱: 안드로이드 권한 창을 띄움
  $("start").hidden=true;keepAwake();
  var el=document.documentElement,fs=el.requestFullscreen||el.webkitRequestFullscreen;
  if(fs){
    var p=fs.call(el);
    if(p&&p.then)p.then(function(){
    }).catch(function(){});
  }
  startGps();
});

/* ---------- 버튼 ---------- */
function setZoom(n){
  zl=Math.max(0,Math.min(ZL.length-1,n));follow=zl>0;
  var b=$("bView");b.classList.toggle("on",follow);b.textContent=follow?"전체":"확대";
  layout(false);
}
$("bView").addEventListener("click",function(){setZoom(zl>0?0:2)});
window.onNativeZoom=function(d){setZoom(zl+d)};

/* 가로/세로 전환: 버튼에는 "바꿀 모드"가 적혀 있다 */
var portraitMq=window.matchMedia("(orientation:portrait)");
function rotLabel(){$("bRot").textContent=portraitMq.matches?"가로 모드로 바꾸기":"세로 모드로 바꾸기"}
if(portraitMq.addEventListener)portraitMq.addEventListener("change",rotLabel);else portraitMq.addListener(rotLabel);
rotLabel();
$("bRot").addEventListener("click",function(){
  var to=portraitMq.matches?"land":"port";
  if(window.Native){try{window.Native.setOrientation(to)}catch(e){}return}
  var o=screen.orientation;
  if(o&&o.lock)o.lock(to==="land"?"landscape":"portrait").catch(function(){toast("이 브라우저에서는 폰을 직접 돌려 주세요.",3000)});
  else toast("이 브라우저에서는 폰을 직접 돌려 주세요.",3000);
});
/* 설정 창 */
$("bSet").addEventListener("click",function(){
  if(calMode){calMode=false;$("toast").hidden=true}
  $("set").hidden=false;
});
$("bClose").addEventListener("click",function(){$("set").hidden=true});
var showCoord=true;
try{showCoord=localStorage.getItem("cp_coord")!=="0"}catch(e){}
function drawCoordSetting(){
  $("coord").hidden=!showCoord;
  $("bCoord").textContent="좌표 표시: "+(showCoord?"켜짐":"꺼짐");
  $("bCoord").classList.toggle("on",showCoord);
}
drawCoordSetting();
$("bCoord").addEventListener("click",function(){
  showCoord=!showCoord;try{localStorage.setItem("cp_coord",showCoord?"1":"0")}catch(e){}
  drawCoordSetting();
});
(function(){
  var s="",i,j,nc=GCOLS.length,x1=GX0+nc*GDX,y1=GY0+GROWS*GDY;
  for(i=0;i<=nc;i++)s+='<line x1="'+(GX0+i*GDX)+'" y1="'+VB.y+'" x2="'+(GX0+i*GDX)+'" y2="'+y1+'"/>';
  for(j=0;j<=GROWS;j++)s+='<line x1="'+VB.x+'" y1="'+(GY0+j*GDY)+'" x2="'+x1+'" y2="'+(GY0+j*GDY)+'"/>';
  for(i=0;i<nc;i++)s+='<text class="hd" text-anchor="middle" x="'+(GX0+(i+.5)*GDX)+'" y="'+(GY0-24)+'">'+GCOLS[i]+'</text>';
  for(j=0;j<GROWS;j++)s+='<text class="hd" text-anchor="middle" x="'+(GX0-GDX/2)+'" y="'+(GY0+(j+.5)*GDY+17)+'">'+(j+1)+'</text>';
  for(i=0;i<nc;i++)for(j=0;j<GROWS;j++)s+='<text class="cell" x="'+(GX0+i*GDX+5)+'" y="'+(GY0+j*GDY+19)+'">'+GCOLS[i]+(j+1)+'</text>';
  $("grid").innerHTML=s;
})();
var showGrid=true;
try{showGrid=localStorage.getItem("cp_grid")!=="0"}catch(e){}
function drawGridSetting(){
  $("grid").style.display=showGrid?"":"none";$("gridRow").hidden=!showGrid;
  $("bGrid").textContent="격자 표시: "+(showGrid?"켜짐":"꺼짐");$("bGrid").classList.toggle("on",showGrid);
}
drawGridSetting();
$("bGrid").addEventListener("click",function(){
  showGrid=!showGrid;try{localStorage.setItem("cp_grid",showGrid?"1":"0")}catch(e){}
  drawGridSetting();
});
$("bTest").addEventListener("click",function(){
  testMode=!testMode;testBase=null;
  this.textContent="테스트 모드: "+(testMode?"켜짐":"꺼짐");this.classList.toggle("on",testMode);
  $("testTag").hidden=!testMode;
  if(calMode){calMode=false;$("toast").hidden=true}
  if(lastG)onFix(lastG);
  if(testMode){$("set").hidden=true;toast(lastG?"지금 자리를 필드 한가운데로 가정했어요. 걸어 보세요.":"GPS가 잡히면 그 자리를 필드 한가운데로 가정해요.",4000)}
});
$("bCal").addEventListener("click",function(){
  $("set").hidden=true;
  if(testMode){toast("테스트 모드에서는 보정할 수 없어요.",3000);return}
  if(!pos){toast("GPS가 잡힌 뒤에 보정할 수 있어요.",3000);return}
  if(far){toast("코만도파크에 도착한 뒤에 보정할 수 있어요.",3000);return}
  calMode=true;
  toast("지금 실제로 서 있는 곳을 지도에서 눌러 주세요");
});
$("bReset").addEventListener("click",function(){
  $("set").hidden=true;
  if(pos){pos.x-=off.x;pos.y-=off.y}
  off={x:0,y:0};try{localStorage.removeItem("cp_off")}catch(e){}
  toast("보정을 처음 값으로 되돌렸어요.",2500);
  if(pos){layout(false);refreshText()}
});
stage.addEventListener("click",function(e){
  if(!calMode||!pos)return;
  var r=stage.getBoundingClientRect();
  var x=(e.clientX-r.left-view.tx)/view.k,y=(e.clientY-r.top-view.ty)/view.k;
  off.x+=x-pos.x;off.y+=y-pos.y;pos.x=x;pos.y=y;
  try{localStorage.setItem("cp_off",JSON.stringify(off))}catch(err){}
  calMode=false;layout(false);refreshText();
  toast("보정 완료. 이 폰에 저장됐어요.",2500);
});

/* 잠금: 장비에 눌려도 버튼이 안 눌리게 */
var lock=$("lock"),holdT=0;
$("bLock").addEventListener("click",function(){lock.hidden=false});
function holdEnd(){clearTimeout(holdT);lock.classList.remove("hold");$("lockMsg").textContent="화면 잠김 · 1초 길게 눌러 해제"}
lock.addEventListener("pointerdown",function(e){
  e.preventDefault();lock.classList.add("hold");$("lockMsg").textContent="계속 누르고 있어요…";
  holdT=setTimeout(function(){lock.hidden=true;holdEnd()},1000);
});
lock.addEventListener("pointerup",holdEnd);lock.addEventListener("pointercancel",holdEnd);
document.addEventListener("contextmenu",function(e){e.preventDefault()});

/* ---------- 설치형 앱: 폰이 GPS·나침반 값을 넣어 주고, 워치로 현재 상태를 보냄 ---------- */
var SPN=["S1 RED","S2","S3","S4 BLUE"];
function sendWatch(old){
  if(!window.Native||!pos)return;
  if(far){try{window.Native.toWatch([0,0,Math.round(pos.acc),-1,"FAR","",Math.round(farM),0,old?1:0].join(","))}catch(e){}return}
  var best=0,bd=1e9,bb=0;
  for(var i=0;i<4;i++){
    var dx=(SPAWNS[i][0]-pos.x)*MPP,dy=(SPAWNS[i][1]-pos.y)*MPP,d=Math.sqrt(dx*dx+dy*dy);
    if(d<bd){bd=d;best=i;bb=(Math.atan2(dx,-dy)*180/Math.PI+360)%360}
  }
  var h=heading();
  try{window.Native.toWatch([pos.x.toFixed(1),pos.y.toFixed(1),Math.round(pos.acc),h?Math.round(h.d)%360:-1,
    zoneOf(pos)||"OUT",SPN[best],Math.round(bd),Math.round(bb)%360,old?1:0].join(","))}catch(e){}
}
window.onNativeFix=function(lat,lon,ac,alt,spd,brg){
  onFix({coords:{latitude:lat,longitude:lon,accuracy:ac,altitude:alt,speed:spd,heading:brg}});
};
window.onNativeHeading=function(d){compass=d;drawHeading()};
window.onNativeMsg=function(m){toast(m,6000)};
window.onNativeDenied=function(){
  gpsDenied=true;drawGps();
  $("permHow").innerHTML="권한이 거부됐어요. <b>설정 &gt; 앱 &gt; ATAK &gt; 권한 &gt; 위치</b>에서 <b>앱 사용 중에만 허용</b>과 <b>정확한 위치</b>를 켜 주세요.";
};
window.onNativePermission=function(ok){if(ok){gpsDenied=false;$("start").hidden=true;drawGps()}};
if(window.Native){var granted=false;try{granted=window.Native.hasLocation()}catch(e){}$("start").hidden=granted}

layout(false);
</script>
</body>
</html>
